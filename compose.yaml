name: yingke
services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null
        2>&1
      interval: 10s
      timeout: 10s
      retries: 20
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /opt/kafka/bin/kafka-topics.sh
    command:
    - --bootstrap-server
    - kafka:9092
    - --create
    - --if-not-exists
    - --topic
    - rec-events
    - --partitions
    - '3'
    - --replication-factor
    - '1'
  jobmanager:
    build: ./infra/flink
    command: jobmanager
    ports:
    - 127.0.0.1:8081:8081
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        python.executable: python3
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/checkpoints/savepoints
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.min-pause: 0
        execution.checkpointing.timeout: 10min
        execution.checkpointing.tolerable-failed-checkpoints: 0
        execution.checkpointing.unaligned: false
      MYSQL_HOST: ${MYSQL_DOCKER_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yingke}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
    - ./infra/flink:/opt/flink/jobs:ro
    - checkpoints:/opt/flink/checkpoints
    extra_hosts:
    - host.docker.internal:host-gateway
  taskmanager:
    build: ./infra/flink
    command: taskmanager
    depends_on:
    - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2048m
        python.executable: python3
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/checkpoints/savepoints
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.min-pause: 0
        execution.checkpointing.timeout: 10min
        execution.checkpointing.tolerable-failed-checkpoints: 0
        execution.checkpointing.unaligned: false
      MYSQL_HOST: ${MYSQL_DOCKER_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yingke}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
    - ./infra/flink:/opt/flink/jobs:ro
    - checkpoints:/opt/flink/checkpoints
    extra_hosts:
    - host.docker.internal:host-gateway
  flink-submit:
    build: ./infra/flink
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      jobmanager:
        condition: service_started
      taskmanager:
        condition: service_started
      mysql-init:
        condition: service_completed_successfully
    entrypoint:
    - bash
    - /opt/flink/jobs/submit.sh
    volumes:
    - ./infra/flink:/opt/flink/jobs:ro
    - checkpoints:/opt/flink/checkpoints
    environment:
      MYSQL_HOST: ${MYSQL_DOCKER_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yingke}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: rec-events
    extra_hosts:
    - host.docker.internal:host-gateway
  app:
    build: .
    volumes:
    - app-runtime:/app/runtime
    - ./runtime/media:/app/runtime/media:ro
    ports:
    - 127.0.0.1:8000:8000
    environment:
      REC_MODE: production
      AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS:-30}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BUSINESS_BACKEND: mysql
      MYSQL_HOST: ${MYSQL_DOCKER_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yingke}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SEED_CATALOG: '1'
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mysql-init:
        condition: service_completed_successfully
    extra_hosts:
    - host.docker.internal:host-gateway
  mysql-init:
    build: .
    environment:
      MYSQL_HOST: ${MYSQL_DOCKER_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yingke}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      REC_MODE: production
      BUSINESS_BACKEND: mysql
      SEED_CATALOG: '1'
    entrypoint:
    - python
    - -m
    - scripts.init_mysql
    extra_hosts:
    - host.docker.internal:host-gateway
volumes:
  app-runtime: null
  kafka-data: null
  checkpoints: null
